<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found</title>
    <link rel="stylesheet" href="404.css">
</head>

<body>

    <main class="error-page">

        <div class="error-content">

            <span class="error-label">⚠️ PAGE NOT FOUND</span>

            <h1>404</h1>

            <h2>Oops! This page doesn't exist.</h2>

            <p>
                The page you're looking for may have been moved,
                deleted, or the link might be incorrect.
            </p>

            <div class="error-buttons">
                <a href="index.html" class="error-btn primary">
                    ← Back to Home
                </a>
            </div>

        </div>

        <div class="error-visual">
            <div class="error-orbit orbit-one"></div>
            <div class="error-orbit orbit-two"></div>
            <div class="error-orbit orbit-three"></div>

            <div class="error-circle">
                404
            </div>
        </div>

    </main>

</body>
</html>
